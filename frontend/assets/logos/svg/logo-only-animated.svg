<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 62.13 80 75.74">
    <!--Left neuron shape-->
    <path d="M60,100 C60,60 100,40 100,100 C100,160 60,140 60,100 Z" fill="#6a5acd">
        <animate attributeName="opacity" values="0.8;1;0.8" dur="3s" repeatCount="indefinite"/>
    </path>
    <!--Right neuron shape-->
    <path d="M140,100 C140,60 100,40 100,100 C100,160 140,140 140,100 Z" fill="#483d8b">
        <animate attributeName="opacity" values="1;0.8;1" dur="3s" repeatCount="indefinite"/>
    </path>
    <!--Central synapse fusion-->
    <ellipse cx="100" cy="100" rx="25" ry="35" fill="#00bcd4">
        <animate attributeName="rx" values="25;28;25" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="ry" values="35;38;35" dur="2s" repeatCount="indefinite"/>
    </ellipse>
    <!--Fusion effect-->
    <circle cx="100" cy="100" r="12" fill="#ffffff" opacity="0.3">
        <animate attributeName="opacity" values="0.3;0.6;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
</svg>
